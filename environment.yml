name: dpri
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.5
  - matplotlib=3.9
  - seaborn=0.13
  - tqdm=4.66
  - joblib=1.4
  - pip:
    # torch is installed separately in setup_cluster.sh with CUDA wheels
    # to avoid getting the CPU-only conda-forge version
    - xgboost==2.1.0
    - requests==2.32.0
